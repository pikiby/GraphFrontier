name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check release tag, metadata and assets
        run: npm run check:release -- "$GITHUB_REF_NAME"

      - name: Attest final plugin assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/styles.css

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
          generate_release_notes: true
          fail_on_unmatched_files: true

  release-vscode:
    needs: build-and-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone package
        run: npm run build:standalone

      - name: Test standalone package
        run: npm run test:standalone

      - name: Build VS Code extension bundles
        run: npm run build:vscode

      - name: Package VSIX with vsce
        working-directory: packages/vscode
        run: npx --yes @vscode/vsce@3 package --no-dependencies --out "dist/graphfrontier-vscode-${GITHUB_REF_NAME}.vsix"

      - name: Test VS Code extension
        run: npm run test:vscode

      - name: Verify VS Code release metadata and VSIX
        run: npm run check:release:vscode -- "$GITHUB_REF_NAME"

      - name: Attest VSIX package
        uses: actions/attest@v4
        with:
          subject-path: packages/vscode/dist/graphfrontier-vscode-${{ github.ref_name }}.vsix

      - name: Attach VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/vscode/dist/graphfrontier-vscode-${{ github.ref_name }}.vsix
          fail_on_unmatched_files: true

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce@3 publish --no-dependencies --packagePath "packages/vscode/dist/graphfrontier-vscode-${GITHUB_REF_NAME}.vsix" -p "$VSCE_PAT"
          else
            echo "::notice::VSCE_PAT secret is not set; skipping VS Code Marketplace publish."
          fi

      - name: Publish to Open VSX Registry (Cursor, Windsurf, VSCodium)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx publish "packages/vscode/dist/graphfrontier-vscode-${GITHUB_REF_NAME}.vsix" -p "$OVSX_PAT"
          else
            echo "::notice::OVSX_PAT secret is not set; skipping Open VSX publish."
          fi
