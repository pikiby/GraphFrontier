name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check release tag, metadata and assets
        run: npm run check:release -- "$GITHUB_REF_NAME"

      - name: Create release zip from dist
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          RELEASE_DIR="dist/release"
          ZIP_NAME="${RELEASE_DIR}/graphfrontier-${VERSION}.zip"
          mkdir -p "${RELEASE_DIR}"
          cd dist
          zip "../${ZIP_NAME}" main.js manifest.json styles.css versions.json LICENSE
          cd ..
          ls -la "${ZIP_NAME}" dist

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/graphfrontier-*.zip
            dist/main.js
            dist/manifest.json
            dist/styles.css
            dist/versions.json
          generate_release_notes: true
          fail_on_unmatched_files: true
